# One stack per environment (staging, production, PR previews). Caddy runs
# on the host and proxies to 127.0.0.1:${APP_PORT}. Secrets and the two
# variables below live in ".env" next to this file (not committed):
#   COMPOSE_PROJECT_NAME  jscm (staging) · jscm-prod · jscm-pr-<n>
#   APP_PORT              3333 (staging) · 3334 (production) · 40000+<n>
name: ${COMPOSE_PROJECT_NAME:-jscm}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    image: jscm-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3333}:3333'
    volumes:
      # Members' CVs (storage/cvs): outside the image, backed up by deploy/backup.sh.
      - uploads:/app/storage
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  pgdata:
  uploads:

networks:
  internal:
