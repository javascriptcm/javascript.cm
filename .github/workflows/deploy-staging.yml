name: CI & deploy

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  check:
    name: Typecheck, tests & build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jscm
          POSTGRES_PASSWORD: jscm
          POSTGRES_DB: jscm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jscm -d jscm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(openssl rand -hex 32)/" .env
      - run: npm run typecheck
      - run: node ace test
      - run: node ace build

  deploy:
    name: Deploy ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://javascript.cm' || 'https://staging.javascript.cm' }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning title=Deploy skipped::STAGING_SSH_KEY, STAGING_KNOWN_HOSTS, STAGING_HOST and STAGING_SSH_USER secrets are not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The key is restricted server-side (forced command deploy/dispatch.sh).
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          target=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} "deploy $target"

  preview:
    name: Pull request preview
    # Opt-in with the "preview" label; same-repository branches only (forks get no secrets).
    # "check" is skipped when the PR is closed: always() still lets this job
    # tear the preview down; otherwise it only runs after a green check.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action == 'closed' || needs.check.result == 'success')
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Create or update the preview
        if: github.event.action != 'closed'
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} "preview up ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
      - name: Comment the preview URL
        if: github.event.action == 'opened' || github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body "Aperçu de cette PR : https://pr-${{ github.event.pull_request.number }}.preview.javascript.cm (mis à jour à chaque push, supprimé à la fermeture)."
      - name: Remove the preview
        if: github.event.action == 'closed'
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} "preview down ${{ github.event.pull_request.number }}"
